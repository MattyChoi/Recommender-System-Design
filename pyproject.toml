[project]
name = "recsys"
version = "0.1.0"
description = "A multi-stage recommender: five-source retrieval, learned ranking, and diversity re-ranking behind a latency-budgeted service."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Matthew Choi", email = "matthew.choi02@gmail.com" }
]
license = "MIT"
dependencies = [
    "boto3==1.43.75",
    "confluent-kafka>=2.12.0",
    "feast[redis]>=0.66.0",
    "huggingface-hub>=1.29.0",
    "ipykernel>=7.3.0",
    "numpy>=2.5.2",
    "protobuf>=7.36.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyspark>=4.2.0",
    "pyyaml>=6.0.3",
    "s3fs>=2026.7.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "data_pipeline", "models", "indexing", "evaluation"]

[tool.ruff]
line-length = 100
# Nothing in notebooks/ is imported by anything, serving/go and infra are not Python.
# common/pb is generated by `make proto` and its first line says DO NOT EDIT.
# Linting it is noise (E501 on an embedded descriptor cannot be fixed) and
# FORMATTING it is worse: every `make proto` would undo every `make fmt`.
exclude = ["notebooks", "serving/go", "infra", "common/pb"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN", "PTH", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"**/tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "confluent_kafka.*", "s3fs.*", "fsspec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "data_pipeline/tests", "evaluation/tests", "models/tests", "indexing/tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests, deselect with -m 'not slow'",
]
# feast 0.66 builds its null-timestamp sentinel with np.datetime64("NaT"), whose
# generic unit numpy 2.5 deprecates; it wants an explicit unit. Third-party and
# harmless -- the value is still int64 min -- so it is silenced rather than
# fixed. Scoped to feast.type_map so the same deprecation still surfaces if it
# ever appears in our own code. Drop this when feast stops emitting it.
filterwarnings = [
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning:feast.type_map",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.1",
    "mypy>=2.3.1",
    "types-grpcio>=1.83.0",
    "types-protobuf>=7.35.1",
    "types-PyYAML>=6.0.12",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "pandas-stubs>=3.0.5.260730",
]
