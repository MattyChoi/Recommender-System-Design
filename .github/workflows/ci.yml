name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read          # least privilege; default token is broader

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung job otherwise runs for six hours
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Notebooks are not importable
        run: |
          ! rg -q "^\s*(from|import) notebooks" --type py . \
            || { echo "notebooks/ must not be imported -- move the logic into a package"; exit 1; }

      - name: Typecheck
        run: uv run mypy .

      - name: Test
        run: uv run pytest

      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  go:
    name: go lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: serving/go/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: serving/go
      - run: go build ./...
        working-directory: serving/go
      - run: go test ./...
        working-directory: serving/go
