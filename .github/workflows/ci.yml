name: ci

on:
  push:
    branches: [main, dev, dev-orch]
  pull_request:

permissions:
  contents: read          # least privilege; default token is broader

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung job otherwise runs for six hours
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --dev --extra serving

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Notebooks are not importable
        run: |
          set +e
          git grep -qE '^[[:space:]]*(from|import)[[:space:]]+notebooks' -- '*.py'
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "notebooks/ must not be imported -- move the logic into a package"; exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "git grep failed (exit $rc)"; exit "$rc"
          fi

      - name: Typecheck
        run: uv run mypy .

      - name: Test
        # Redundant with the fixture, which pins it too but writing for visibility
        env:
          RECSYS_STORAGE__BACKEND: local
        # The floor has to be measured before it can be pinned
        # TODO(coverage): pin the floor, i.e. append --cov-fail-under=<floor>.
        run: uv run pytest --cov --cov-report=term-missing

      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  go:
    name: go lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: serving/go/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not `latest`: a new release adds checks, and an unchanged
          # tree should not go red overnight. Match it locally:
          #   curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
          version: v2.15.0
          working-directory: serving/go
      - run: go build ./...
        working-directory: serving/go
      - run: go test ./...
        working-directory: serving/go

  # The orchestrator image, run with every backend deliberately absent. This is
  # the only part of the stack that fits a hosted runner: triton reserves an
  # NVIDIA device and its image alone would not fit the disk. The ranked-slate
  # smoke needs artifacts and a GPU, so it lives on the self-hosted runner.
  smoke:
    name: orchestrator image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [go]          # don't spend a build on code that does not compile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/serving.Dockerfile
          tags: recsys/serving:ci
          load: true          # into the local daemon, not a registry
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev --extra serving

      # Catches a broken compose file here rather than on a developer's machine.
      # Both sidecars declare .env as not required, so this parses on a clone
      # that has no .env -- which is every clone, since .env is gitignored.
      - name: Compose file is valid
        run: docker compose config -q

      - name: Smoke
        env:
          RECSYS_SMOKE_IMAGE: recsys/serving:ci
        run: uv run pytest -m integration tests/test_serving_smoke.py

  # Stage 8. ON MAIN ONLY, and only behind the three jobs above.
  images:
    name: build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, go, smoke]
    permissions:
      contents: read
      packages: write   # narrower than the workflow default: only this job publishes
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The per-run token, not a PAT. It expires with the job and is scoped
          # by the permissions block above.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: the commit SHA, immutable and the only one worth deploying,
      # and the branch name as a moving pointer for humans. Deliberately NOT
      # `latest` -- a tag that changes under a running cluster turns a rollback
      # into a guess about which build was actually serving.
      #
      # metadata-action also lowercases the image name, which ghcr requires and
      # the owner's name does not satisfy.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/recsys-serving
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/serving.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reads the cache the smoke job just wrote, so this is a re-tag and a
          # push rather than a second compile. No cache-to: smoke owns writing it.
          cache-from: type=gha

      # NOT the sidecar image, and the reason is measured rather than cautious.
      # It is 4.68GB -- torch 750MB, pyspark 483MB, ray 233MB, transformers
      # 114MB, none of which serving/features or serving/retrieval import --
      # against a hosted runner with roughly 14GB of free disk shared between
      # the wheel downloads, the layers and the buildkit cache.
      #
      # Unblocking it is the dependency split, not a CI change: [project]
      # dependencies is currently the TRAINING set and serving inherits all of
      # it. Moving the training-only packages into their own extras takes the
      # image to roughly 2GB, at which point this job can push it too. Until
      # then the sidecar image is built on BigBox.
