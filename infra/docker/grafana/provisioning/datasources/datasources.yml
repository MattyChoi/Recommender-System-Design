apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus

    # Dashboard JSON references its datasource BY UID. Auto-generated uids
    # differ per install, so pinning it here is what makes the committed
    # dashboards in ../../dashboards/ portable to anyone else's Grafana.
    uid: prometheus

    # proxy = Grafana's BACKEND makes the request, so the URL is resolved
    # inside the compose network and the service name works. Under `direct`
    # the browser would fetch it and this would have to be localhost:9090 --
    # getting that backwards is the classic "blank panels in a container" bug.
    access: proxy
    url: http://prometheus:9090

    isDefault: true
    editable: false      # the file is the source of truth; edit it, not the UI
