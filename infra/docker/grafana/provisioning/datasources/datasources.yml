apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus

    # Dashboard JSON references its datasource BY UID. Auto-generated uids
    # differ per install, so pinning it here is what makes the committed
    # dashboards in ../../dashboards/ portable to anyone else's Grafana.
    uid: prometheus

    # proxy = Grafana's BACKEND makes the request, so the URL is resolved
    # inside the compose network and the service name works. Under `direct`
    # the browser would fetch it and this would have to be localhost:9090 --
    # getting that backwards is the classic "blank panels in a container" bug.
    access: proxy
    url: http://prometheus:9090

    isDefault: true
    editable: false      # the file is the source of truth; edit it, not the UI

  # Traces. Same reasoning as above on both counts: the uid is pinned so a
  # committed dashboard or a trace link can name it, and proxy access means
  # Grafana's backend resolves `tempo` on the compose network.
  #
  # Port 3200 is Tempo's QUERY api. Its OTLP receiver on 4317 is a different
  # port for a different direction -- pointing this URL at 4317 yields a
  # datasource that saves cleanly and finds no traces.
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
