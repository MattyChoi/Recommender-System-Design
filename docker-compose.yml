services:
  kafka:
    image: apache/kafka:4.3.1            # Kafka 4.3.1, released 2026-06-23
    container_name: recsys-kafka
    ports: ["9092:9092"]            # client bootstrap port, reachable from your Mac
    environment:
      # Unique ID of this node within the KRaft cluster. Single node, so 1.
      KAFKA_NODE_ID: 1

      # KRaft mode: this one node wears both hats, so no ZooKeeper container is
      # needed. "broker" serves produce/consume traffic; "controller" owns the
      # cluster metadata quorum (the job ZooKeeper used to do). In production
      # these are separate machines.
      KAFKA_PROCESS_ROLES: broker,controller

      # Sockets this node BINDS. Empty host means "all interfaces".
      # PLAINTEXT:9092 = client traffic. CONTROLLER:9093 = metadata quorum,
      # which here is just this node talking to itself.
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT

      # Members of the metadata quorum, as <nodeId>@<host>:<port>. One voter:
      # itself, at localhost:9093 (true, since it resolves inside its own container).
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Which of the listener names above carries controller traffic.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Consumer offsets live in an internal topic that defaults to 3 replicas.
      # Unsatisfiable on one broker, so the topic would never be created.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0   # removes a 3s startup pause
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh",
             "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7.4.11-alpine   # Alpine build, ~40MB instead of ~130MB.
    container_name: recsys-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: recsys/minio:RELEASE.2025-09-07T16-13-09Z   # built from source: make minio-image
    container_name: recsys-minio
    # "server" is the subcommand that starts the object-storage server.
    # /data is the storage root INSIDE the container (see the volume below).
    # --console-address moves the browser UI to its own port so it does not
    # collide with the S3 API, which stays on the default 9000.
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"              # S3-compatible API -- point boto3/pyarrow here
      - "9001:9001"              # web console
    environment:
      # Initial admin account. These double as the S3 access key and secret key.
      # Stock defaults: fine locally, must change before this leaves your laptop.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # Mounts the named volume declared at the bottom onto the storage root, so
    # bronze/silver/gold Parquet survives `docker compose restart` -- but NOT
    # `down -v`, which is what `make down` runs.
    volumes: ["minio:/data"]
    # "mc ready local" asks the bundled MinIO client whether the server can
    # actually serve requests, not merely whether the process is alive.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.2   # MLflow 3.15.2, released 2026-08-03
    container_name: recsys-mlflow
    # --host 0.0.0.0 binds all interfaces. Required: the default binds loopback
    # only, which would make the server unreachable from outside the container.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://mlflow/
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # Host 5001, not 5000: macOS AirPlay Receiver (ControlCenter) holds 5000 by
    # default, so 5000:5000 fails to bind on a stock Mac. UI at localhost:5001.
    ports: ["5001:5000"]
    volumes: ["mlflow:/mlflow"]
    # Map form, not the [minio] short form -- only this syntax accepts a
    # condition. Holds mlflow back until minio reports healthy, instead of
    # starting both at once and racing.
    depends_on:
      minio:
        condition: service_healthy
    # Python rather than curl: curl is not guaranteed to be in this image, and a
    # healthcheck that can never pass is worse than none -- `--wait` hangs on it.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.14.0       # Prometheus 3.14.0, released 2026-08-17
    container_name: recsys-prometheus
    ports: ["9090:9090"]         # query UI and API
    # Mounts your scrape config over the path the image reads at startup.
    # ":ro" = read-only, so the container cannot modify your repo file.
    volumes: 
      - "./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./serving/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro"

  grafana:
    image: grafana/grafana:13.2.0        # Grafana 13.2.0, released 2026-08-18
    container_name: recsys-grafana
    ports: ["3000:3000"]
    environment:
      # GF_<SECTION>_<KEY> maps onto grafana.ini -- this is [auth.anonymous]
      # enabled=true, which skips the login screen. Quoted because YAML would
      # otherwise parse bare true as a boolean, and env values must be strings.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      # Runtime state (users, prefs, the sqlite db). Survives `down`, not `down -v`.
      - "grafana:/var/lib/grafana"
      # Provider configs -- Grafana globs /etc/grafana/provisioning/{datasources,dashboards}/*.yml
      # at STARTUP, so the host path must be the provisioning/ dir itself, not
      # its parent. Mounting the parent nests it one level deeper and Grafana
      # silently finds nothing.
      - "./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro"
      # The dashboard JSON the provider above loads. Separate mount so provider
      # config and dashboard content stay separate in the repo.
      - "./infra/docker/grafana/dashboards:/etc/grafana/dashboards:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "recsys-host:${HOST_IP:-host-gateway}"

  # OpenTelemetry collector: the tail-sampling decision point.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.142.0
    container_name: recsys-otel
    # -contrib, not the core image: tail_sampling ships only in contrib, and
    # the core image accepts the config file and ignores the processor.
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"              # OTLP/gRPC -- the -otlp flag on the orchestrator
      - "8888:8888"              # its own metrics, scraped by prometheus above
    volumes:
      - "./infra/docker/otel-collector.yaml:/etc/otel/config.yaml:ro" 

  triton:
    image: nvcr.io/nvidia/tritonserver:25.12-py3
    container_name: recsys-triton
    command: ["tritonserver", "--model-repository=/models"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8000:8000"              # HTTP/REST v2, used only by the healthcheck below
      - "8001:8001"              # gRPC -- the orchestrator's -triton flag
      - "8002:8002"              # its own Prometheus metrics, scraped by prometheus
    volumes:
      # The MODEL REPOSITORY, not the model. Triton reads
      # <repo>/<model>/<version>/, so this must be the directory holding
      # `ranker/`, never `ranker/` itself. Read-only: Triton only ever reads it,
      # and a writable mount invites a container to modify a checked-in artifact.
      - "./serving/triton:/models:ro"
    # 64MB is Docker's default and Triton's docs call for more. Not measured
    # here, but an obscure shared-memory failure is a bad way to find the floor.
    shm_size: "1gb"
    # curl, not the python trick the mlflow service needs: the tritonserver image
    # ships it. /v2/health/ready answers 200 only once the model repository has
    # LOADED, so `--wait` gates on the ranker being SERVABLE rather than on the
    # process existing.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.0
    container_name: recsys-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      # The INTERNAL listener, because this reaches the broker from inside the
      # compose network. localhost:9092 is the host-side address and here would
      # resolve to the registry container itself.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # BACKWARD_TRANSITIVE, not the BACKWARD default. BACKWARD checks a new
      # schema against the PREVIOUS version only, which is enough when readers
      # see recent data only. This log is retained and replayed from the
      # beginning, so a reader meets EVERY historical schema and the check has
      # to be transitive or it is checking the wrong thing.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD_TRANSITIVE
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Python sidecars
  features:
    profiles: ["sidecars"]
    image: recsys/sidecars:dev
    container_name: recsys-features
    command: ["python", "-m", "serving.features"]
    depends_on:
      redis: {condition: service_healthy}
    env_file:
      - path: .env
        required: false
    environment:
      # redis:6379 from inside the network. feature_store.yaml reads this.
      REDIS_URL: redis:6379
      # Absolute: Feast resolves a RELATIVE registry path against repo_path
      # (the feature_repo dir), so a repo-relative value gets doubled.
      FEAST_REGISTRY: /repo/data_pipeline/features/recsys_store/feature_repo/registry.db
      RECSYS_STORAGE__ENDPOINT_URL: http://minio:9000
      FEATURES_PROCESSES: "4"
    volumes:
      - ./serving/artifacts:/repo/serving/artifacts:ro
      - ./data_pipeline/features/recsys_store:/repo/data_pipeline/features/recsys_store:ro
    ports: ["15053:15053", "15063:15063", "15073:15073", "15083:15083"]
    healthcheck:
      # All FOUR copies, not just the first. `supervise` binds one process per
      # strided port, so a probe that only asks :15053 reports healthy while
      # three of the four are dead -- and the orchestrator round-robins into
      # them.
      test: ["CMD", "python", "-c",
             "import os,grpc;from common.pb import features_pb2 as p,features_pb2_grpc as g;b=int(os.environ['FEATURES_PORT']);[g.FeaturesStub(grpc.insecure_channel(f'localhost:{b+10*i}')).Health(p.FeaturesHealthRequest(),timeout=3) for i in range(int(os.environ['FEATURES_PROCESSES']))]"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 90s

  retrieval:
    profiles: ["sidecars"]
    image: recsys/sidecars:dev
    container_name: recsys-retrieval
    command: ["python", "-m", "serving.retrieval"]
    depends_on:
      redis: {condition: service_healthy}
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis:6379
      RETRIEVAL_PROCESSES: "4"
    volumes:
      # Read-only, and `data/` is in .dockerignore, so these are never baked.
      - ./data/index:/repo/data/index:ro
      - ./data/checkpoints:/repo/data/checkpoints:ro
      # load_item_tables reads ONE parquet file from the local gold layer --
      # settings.paths.gold, not the storage backend, so this is never S3.
      - ./data/gold/item_content:/repo/data/gold/item_content:ro
    ports: ["15052:15052", "15062:15062", "15072:15072", "15082:15082"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os,grpc;from common.pb import retrieval_pb2 as p,retrieval_pb2_grpc as g;b=int(os.environ['RETRIEVAL_PORT']);[g.RetrievalStub(grpc.insecure_channel(f'localhost:{b+10*i}')).Health(p.RetrievalHealthRequest(),timeout=3) for i in range(int(os.environ['RETRIEVAL_PROCESSES']))]"]
      interval: 10s
      timeout: 15s
      retries: 24
      start_period: 240s

# Named volumes. An empty value means "use the default local driver".
volumes:
  minio:
  mlflow:
  grafana:
  redis:
