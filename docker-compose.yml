services:
  kafka:
    image: apache/kafka:4.3.1            # Kafka 4.3.1, released 2026-06-23
    container_name: recsys-kafka
    ports: ["9092:9092"]            # client bootstrap port, reachable from your Mac
    environment:
      # Unique ID of this node within the KRaft cluster. Single node, so 1.
      KAFKA_NODE_ID: 1

      # KRaft mode: this one node wears both hats, so no ZooKeeper container is
      # needed. "broker" serves produce/consume traffic; "controller" owns the
      # cluster metadata quorum (the job ZooKeeper used to do). In production
      # these are separate machines.
      KAFKA_PROCESS_ROLES: broker,controller

      # Sockets this node BINDS. Empty host means "all interfaces".
      # PLAINTEXT:9092 = client traffic. CONTROLLER:9093 = metadata quorum,
      # which here is just this node talking to itself.
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT

      # Members of the metadata quorum, as <nodeId>@<host>:<port>. One voter:
      # itself, at localhost:9093 (true, since it resolves inside its own container).
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Which of the listener names above carries controller traffic.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Consumer offsets live in an internal topic that defaults to 3 replicas.
      # Unsatisfiable on one broker, so the topic would never be created.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0   # removes a 3s startup pause
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh",
             "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7.4.11-alpine   # Alpine build, ~40MB instead of ~130MB.
    container_name: recsys-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z   # newest tag published to Docker Hub
    container_name: recsys-minio
    # "server" is the subcommand that starts the object-storage server.
    # /data is the storage root INSIDE the container (see the volume below).
    # --console-address moves the browser UI to its own port so it does not
    # collide with the S3 API, which stays on the default 9000.
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"              # S3-compatible API -- point boto3/pyarrow here
      - "9001:9001"              # web console
    environment:
      # Initial admin account. These double as the S3 access key and secret key.
      # Stock defaults: fine locally, must change before this leaves your laptop.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # Mounts the named volume declared at the bottom onto the storage root, so
    # bronze/silver/gold Parquet survives `docker compose restart` -- but NOT
    # `down -v`, which is what `make down` runs.
    volumes: ["minio:/data"]
    # "mc ready local" asks the bundled MinIO client whether the server can
    # actually serve requests, not merely whether the process is alive.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.2   # MLflow 3.15.2, released 2026-08-03
    container_name: recsys-mlflow
    # --host 0.0.0.0 binds all interfaces. Required: the default binds loopback
    # only, which would make the server unreachable from outside the container.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://mlflow/
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # Host 5001, not 5000: macOS AirPlay Receiver (ControlCenter) holds 5000 by
    # default, so 5000:5000 fails to bind on a stock Mac. UI at localhost:5001.
    ports: ["5001:5000"]
    volumes: ["mlflow:/mlflow"]
    # Map form, not the [minio] short form -- only this syntax accepts a
    # condition. Holds mlflow back until minio reports healthy, instead of
    # starting both at once and racing.
    depends_on:
      minio:
        condition: service_healthy
    # Python rather than curl: curl is not guaranteed to be in this image, and a
    # healthcheck that can never pass is worse than none -- `--wait` hangs on it.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.14.0       # Prometheus 3.14.0, released 2026-08-17
    container_name: recsys-prometheus
    ports: ["9090:9090"]         # query UI and API
    # Mounts your scrape config over the path the image reads at startup.
    # ":ro" = read-only, so the container cannot modify your repo file.
    volumes:
      - "./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      # The alert rules, mounted at the path prometheus.yml's `rule_files`
      # names. Prometheus REFUSES TO START on a rule file it cannot read, so
      # this mount is not optional once that key exists -- which is exactly why
      # the rules live beside the service that emits the metrics and are
      # mounted in, rather than being pasted into the scrape config.
      - "./serving/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro"
    # The orchestrator runs on the HOST, not in this file: it loads artifacts
    # from the working tree and talks to sidecars started with `make`. Docker
    # Desktop resolves host.docker.internal for free; native Linux does not,
    # and BigBox is Linux, so it is mapped explicitly.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # OpenTelemetry collector: the tail-sampling decision point.
  #
  # ⚠️ This is the component that makes tracing useful here rather than
  # decorative. Head sampling in the orchestrator decides at the root, before
  # anything has degraded, so below ratio 1.0 it drops the interesting traces
  # at the same rate as the boring ones. The collector sees the FINISHED trace
  # and can keep it on what actually happened.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.142.0
    container_name: recsys-otel
    # -contrib, not the core image: tail_sampling ships only in contrib, and
    # the core image accepts the config file and ignores the processor.
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"              # OTLP/gRPC -- the -otlp flag on the orchestrator
      - "8888:8888"              # its own metrics, scraped by prometheus above
    volumes:
      - "./infra/docker/otel-collector.yaml:/etc/otel/config.yaml:ro"

  grafana:
    image: grafana/grafana:13.2.0        # Grafana 13.2.0, released 2026-08-18
    container_name: recsys-grafana
    ports: ["3000:3000"]
    environment:
      # GF_<SECTION>_<KEY> maps onto grafana.ini -- this is [auth.anonymous]
      # enabled=true, which skips the login screen. Quoted because YAML would
      # otherwise parse bare true as a boolean, and env values must be strings.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      # Runtime state (users, prefs, the sqlite db). Survives `down`, not `down -v`.
      - "grafana:/var/lib/grafana"
      # Provider configs -- Grafana globs /etc/grafana/provisioning/{datasources,dashboards}/*.yml
      # at STARTUP, so the host path must be the provisioning/ dir itself, not
      # its parent. Mounting the parent nests it one level deeper and Grafana
      # silently finds nothing.
      - "./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro"
      # The dashboard JSON the provider above loads. Separate mount so provider
      # config and dashboard content stay separate in the repo.
      - "./infra/docker/grafana/dashboards:/etc/grafana/dashboards:ro"

# Named volumes. An empty value means "use the default local driver".
volumes:
  minio:
  mlflow:
  grafana:
  redis:
