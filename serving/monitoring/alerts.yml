# Alert rules for the orchestrator.
groups:
  - name: recsys-latency
    interval: 30s
    rules:
      - alert: RecsysP99OverBudget
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(recsys_request_duration_seconds_bucket[5m]))
          ) > 0.1
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "p99 is {{ $value | humanizeDuration }}, past the 100ms budget"
          runbook: "Check recsys_stage_duration_seconds to see WHICH stage; a single end-to-end number says a request was slow, the per-stage one says why."

      - alert: RecsysStageOverBudget
        # Per-stage budgets: features 8ms, retrieval 25ms, rank 35ms, rerank
        # 5ms.
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, stage) (rate(recsys_stage_duration_seconds_bucket[5m]))
          )
          > on (stage)
          (
            label_replace(vector(0.008), "stage", "features", "", "")
            or label_replace(vector(0.025), "stage", "retrieval", "", "")
            or label_replace(vector(0.035), "stage", "rank", "", "")
            or label_replace(vector(0.005), "stage", "rerank", "", "")
          )
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "stage {{ $labels.stage }} p99 is past its budget"

  - name: recsys-errors
    interval: 30s
    rules:
      - alert: RecsysErrorRate
        expr: |
          sum(rate(recsys_requests_total{code!~"OK|InvalidArgument"}[5m]))
          / clamp_min(sum(rate(recsys_requests_total[5m])), 0.001)
          > 0.01
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "server error rate is {{ $value | humanizePercentage }}"

      - alert: RecsysClientErrorSpike
        expr: |
          sum(rate(recsys_requests_total{code="InvalidArgument"}[5m]))
          / clamp_min(sum(rate(recsys_requests_total[5m])), 0.001)
          > 0.05
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $value | humanizePercentage }} of requests are being rejected as malformed"

  - name: recsys-degradation
    interval: 30s
    rules:
      - alert: RecsysFallbackRate
        expr: |
          sum(rate(recsys_fallback_total[5m]))
          / clamp_min(sum(rate(recsys_requests_total{code="OK"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "{{ $value | humanizePercentage }} of slates are the popularity fallback"

      - alert: RecsysRankerDegraded
        expr: |
          sum(rate(recsys_degraded_total{source="ranker"}[5m]))
          / clamp_min(sum(rate(recsys_requests_total{code="OK"}[5m])), 0.001)
          > 0.02
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "{{ $value | humanizePercentage }} of requests served the retrieval order"

      - alert: RecsysFeatureGatewayDegraded
        expr: |
          sum(rate(recsys_degraded_total{source="features"}[5m]))
          / clamp_min(sum(rate(recsys_requests_total{code="OK"}[5m])), 0.001)
          > 0.02
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "{{ $value | humanizePercentage }} of requests ran against a cold user"

      - alert: RecsysRetrievalOnRungTwo
        expr: sum(rate(recsys_incomplete_rows_total[5m])) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "retrieval resolves to fallback; exact search is ~2 cores at peak QPS"

      - alert: RecsysSeenFilterSaturated
        expr: |
          histogram_quantile(
            0.5,
            sum by (le) (rate(recsys_stage_candidates_bucket{stage="unblocked"}[10m]))
          ) < 1
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "the seen-list is blocking every candidate; check capacity against items per user"

  - name: recsys-experiments
    interval: 60s
    rules:
      - alert: RecsysExperimentImbalance
        expr: |
          (
            max(sum by (variant) (rate(recsys_experiment_assignments_total{variant!="none"}[30m])))
            /
            clamp_min(min(sum by (variant) (rate(recsys_experiment_assignments_total{variant!="none"}[30m]))), 0.001)
          ) > 1.2
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "experiment arms differ by more than 20%; run the chi-square before trusting any result"

  - name: recsys-drift
    interval: 60s
    rules:
      # 0.25 is common.drift.PSI_SKEW. YAML cannot import it, so
      # tests/test_drift_window.py asserts the two agree -- a gauge that pages
      # at a value docs/skew_report.md calls OK is worse than no gauge.
      #
      # alerting="true" is the churn label, not a filter: a feature whose
      # distribution turns over by design still has a series, it just must not
      # page. On a news corpus a naive PSI alarm fires constantly, gets muted,
      # and is then worse than nothing.
      - alert: RecsysFeatureDrift
        expr: max by (feature) (recsys_feature_psi{alerting="true"}) > 0.25
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.feature }} PSI is {{ $value }}, past the 0.25 skew band"
          runbook: "Served features have moved off the bins the model was fitted on. Compare against docs/skew_report.md, which runs the same statistic in batch; if both agree the model needs a retrain, not the monitor a fix."

      # Separate from the PSI alert on purpose. A window that never fills means
      # the monitor is not seeing traffic -- an absent PSI, which `for: 30m` on
      # the rule above would otherwise sit through silently, since a series that
      # does not exist cannot breach a threshold.
      - alert: RecsysDriftMonitorStarved
        expr: recsys_drift_window_rows < 500
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "the drift window holds {{ $value }} rows; below 500 no PSI is reported at all"
          runbook: "Starvation has four causes and recsys_drift_records_* separates them: a flat _seen is no traffic or a dead consumer; _degraded climbing with it is a feature-fetch outage, which is an availability incident and not skew; _found flat is a feature store with no row for these users; _malformed above zero is a baseline whose width disagrees with the served vector, so re-dump it."
