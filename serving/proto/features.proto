// The feature gateway's contract: entity ids in, feature vectors out.
//
// Regenerate stubs after any edit:  make proto
//
// Why this is a service and not a library call: Feast's online store is read
// through Feast's own SDK, and its Redis encoding is a Feast-internal protobuf
// layout. Reimplementing that in Go would couple the request path to a
// third-party wire format whose changes look like corrupt features rather than
// like a version mismatch. So Feast is used the way it is meant to be used,
// from Python, behind one hop.
//
// **This gateway owns the ORDER of every feature vector it returns.** That
// order is not cosmetic: the ranker's ONNX graph was exported against a fixed
// column order and cannot detect a permutation -- the shape is right, the dtype
// is right, and the model scores a different world in silence. The orchestrator
// carries the names alongside the values for exactly that reason and checks
// them before scoring.

syntax = "proto3";
package recsys.v1;
// Same Go package as the other files here; see retrieval.proto for why.
option go_package = "github.com/MattyChoi/Recommender-System-Design/serving/go/internal/pb;pb";

service Features {
  // Everything about the user that the fan-out and the ranker both need,
  // fetched ONCE. §14.2 fetches user features and history in parallel before
  // retrieval; splitting them across two calls would let the retriever and the
  // ranker see two different snapshots of the same user mid-request.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // Per-item features for the ranker's candidate set. Separate from GetUser
  // because it happens LATER -- the candidates do not exist until retrieval
  // and filtering have run.
  rpc GetItems(GetItemsRequest) returns (GetItemsResponse);

  rpc Health(FeaturesHealthRequest) returns (FeaturesHealthResponse);
}

message GetUserRequest {
  // The external user id: Feast's entity key, and the same string the
  // retrieval sidecar takes.
  string user_id = 1;

  // How much history to return. The tower pools at most MAX_HISTORY, so more
  // than that is bytes on the wire nothing reads.
  int32 max_history = 2;
}

message GetUserResponse {
  // Values in `names` order, ready to hand to the tower.
  repeated float values = 1;

  // The column names, travelling WITH the values. The one part of the contract
  // that cannot be checked by shape: a permuted vector is the right length and
  // the right type, and produces a plausible embedding for a user who does not
  // exist.
  repeated string names = 2;

  // Recent history as INTERNAL item indices, most recent first.
  //
  // Translated here rather than in the orchestrator. Feast stores
  // `last_50_items` as external id strings and the tower indexes an embedding
  // table by position, so someone must map them; doing it here keeps the
  // item_map in one process rather than two that can be a build apart.
  repeated int32 history = 3;

  // Items in `last_50_items` that the item_map did not know. Reported rather
  // than dropped in silence: a rising count means the map and the feature
  // store are drifting apart, which otherwise shows up as users mysteriously
  // looking colder than they are.
  int32 unmapped_history = 4;

  // False when the store had no row for this user and defaults were served.
  // §14.2 degrades rather than failing on a feature miss, and a miss rate that
  // climbs is the signal that materialisation has stopped.
  bool found = 5;
}

message GetItemsRequest {
  // Internal item indices, in candidate order.
  repeated int32 items = 1;
}

message GetItemsResponse {
  // One row per requested item, in REQUEST order, flattened row-major.
  //
  // Flat rather than repeated-message: the orchestrator reshapes it into the
  // ranker's matrix, and a message per candidate would allocate ~500 objects
  // per request to carry ~11 floats each.
  repeated float values = 1;

  // Column names for every row. Same reason as GetUserResponse.names.
  repeated string names = 2;

  // Per-item, aligned with the request: false where the store had no row and
  // defaults were used. A cold article is normal on a news corpus; ALL of them
  // being cold is a broken materialisation.
  repeated bool found = 3;
}

message FeaturesHealthRequest {}

message FeaturesHealthResponse {
  bool ready = 1;
  string detail = 2;

  // How stale the online store is, by its own event timestamps. docs/design.md
  // budgets features as daily and hourly; an alert on freshness lag > 10
  // minutes is meaningless without a number to alert on.
  int64 oldest_feature_age_seconds = 3;

  // The item_map snapshot used for history translation, so a gateway and an
  // index built from different maps can be told apart.
  string item_map_version = 4;
}
