// The recommender system product API

syntax = "proto3";
package recsys.v1;
option go_package = "github.com/MattyChoi/Recommender-System-Design/serving/go/internal/pb;pb";

service Recommender {
  rpc GetRecommendations(RecommendRequest) returns (RecommendResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message RecommendRequest {
  string user_id = 1;
  string surface = 2;                 // home_rail | search | detail_page
  int32 num_results = 3;

  // Client-side exclusions, ON TOP of the server's seen-list. Not the same
  // thing: the seen-list is what WE showed, this is what the caller knows it
  // has already rendered.
  repeated string exclude_item_ids = 4;

  map<string, string> context = 5;
}

message ScoredItem {
  string item_id = 1;

  // The score this item was ORDERED by -- after re-ranking, not the ranker's
  // raw output. Those differ whenever a policy fires, and reporting the
  // ranker's score beside a re-ranked order is how a debugging session starts
  // from a false premise.
  float score = 2;

  map<string, float> debug_scores = 3;

  // Which retrievers PROPOSED it. Part I measured that a source can contribute
  // features without contributing candidates, so this is the proposing set,
  // not the scoring set.
  repeated string sources = 4;

  // P(this item in this slot | policy, history). **Log it or lose it.** 1.0
  // means the slot was deterministic and carries no information for an
  // off-policy estimator; below 1.0 came from an exploration slot.
  float propensity = 5;

  // 0-based slot. Recorded because a position-bias correction needs the slot
  // the SERVER chose.
  int32 position = 6;
}

message RecommendResponse {
  repeated ScoredItem items = 1;

  string model_version = 2;
  string index_version = 3;
  string experiment_variant = 4;

  int32 latency_ms = 5;

  // True when the pipeline could not produce a real slate.
  bool used_fallback = 6;

  // Retrievers that timed out or errored and were dropped.
  repeated string degraded_sources = 7;

  // Per-stage milliseconds.
  map<string, int32> stage_latency_ms = 8;

  // Candidates surviving each stage. 
  map<string, int32> stage_counts = 9;
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;

  // Why not, when not ready. A boolean alone sends someone to the logs.
  string detail = 2;

  string model_version = 3;
  string index_version = 4;

  // "hnsw" or "flat". 
  string index_kind = 5;

  // The efSearch actually loaded.
  int32 index_ef_search = 6;
}